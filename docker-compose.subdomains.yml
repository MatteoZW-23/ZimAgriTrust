version: '3.8'

services:
  # Nginx Reverse Proxy for Subdomain Routing
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - public-website
      - admin-dashboard
      - agent-portal
      - app-portal
      - backend
    networks:
      - agric-network
    restart: always

  # Public Website (port 3000)
  public-website:
    build: ./apps/public-website
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    networks:
      - agric-network

  # Admin Dashboard (port 3001) - admin.<domain>
  admin-dashboard:
    build: ./apps/admin-dashboard
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    networks:
      - agric-network

  # Agent Portal (port 3002) - agent.<domain>
  agent-portal:
    build: ./apps/agent-portal
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    networks:
      - agric-network

  # App Portal (port 3003) - Farmer/Buyer web dashboard
  app-portal:
    build: ./apps/app-portal
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    networks:
      - agric-network

  # Backend API (port 8080)
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/agri_trust
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: test-key-replace-in-prod
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:5000,http://localhost:19006,http://localhost:19000,http://localhost:19002,http://localhost:5173
      ALLOWED_HOSTS: "*"
      WATCHFILES_FORCE_POLLING: "false"
      # Security Configuration
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: "100"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      ADMIN_RATE_LIMIT_REQUESTS: "30"
      ADMIN_RATE_LIMIT_WINDOW_SECONDS: "60"
      ADMIN_IP_WHITELIST: ""
      ADMIN_SESSION_TIMEOUT_MINUTES: "30"
      ADMIN_MFA_ENABLED: "false"
      ADMIN_AUDIT_LOGGING: "true"
      ACCOUNT_LOCKOUT_ENABLED: "true"
      ACCOUNT_LOCKOUT_ATTEMPTS: "5"
      ACCOUNT_LOCKOUT_DURATION_MINUTES: "30"
      PASSWORD_MIN_LENGTH: "8"
      PASSWORD_REQUIRE_UPPERCASE: "true"
      PASSWORD_REQUIRE_LOWERCASE: "true"
      PASSWORD_REQUIRE_DIGIT: "true"
      PASSWORD_REQUIRE_SPECIAL: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - agric-network

  # PostgreSQL Database
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agri_trust
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
      timeout: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agric-network

  # Redis Cache
  redis:
    image: redis:7
    networks:
      - agric-network

networks:
  agric-network:
    driver: bridge

volumes:
  postgres_data:
