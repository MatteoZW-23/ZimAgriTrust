name: fintech-api-ci

on:
  pull_request:
    paths:
      - "services/fintech-api/**"
      - ".github/workflows/fintech-api-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/fintech-api/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fintech-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/fintech-api/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - run: docker build -t fintech-api:${{ github.sha }} .
