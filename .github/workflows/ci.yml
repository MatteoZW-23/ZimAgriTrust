name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-cov bandit safety
      
      - name: Run security checks
        run: |
          cd backend
          bandit -r app/ -f json -o bandit-report.json || true
          safety check --output json > safety-report.json || true
      
      - name: Run tests
        env:
          ADMIN_BOOTSTRAP_TOKEN: test-bootstrap-token-ci-environment
          SECRET_KEY: test-secret-key-for-ci-environment-minimum-32-chars
          REFRESH_SECRET_KEY: test-refresh-secret-key-for-ci-environment-minimum-32-chars
          PIN_PEPPER: test-pin-pepper-for-ci-environment-minimum-16-chars
        run: |
          cd backend
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json

  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd apps/admin-dashboard
          npm ci
      
      - name: Run security audit
        run: |
          cd apps/admin-dashboard
          npm audit --audit-level=moderate --json > audit-report.json || true
      
      - name: Build dashboard
        run: |
          cd apps/admin-dashboard
          npm run build
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true

  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies (user-mobile)
        run: |
          cd apps/user-mobile
          npm ci
      
      - name: Install dependencies (driver-mobile)
        run: |
          cd apps/driver-mobile
          npm ci
      
      - name: Validate user-mobile package
        run: |
          cd apps/user-mobile
          npm pkg get name version

      - name: Validate driver-mobile package
        run: |
          cd apps/driver-mobile
          npm pkg get name version

  build-and-push:
    needs: [test-backend, test-dashboard, test-mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DOCKER_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/agritrust-backend:latest,${{ secrets.DOCKER_USERNAME }}/agritrust-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/agritrust-backend:latest
          cache-to: type=inline
      
      - name: Build and push public-website
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/public-website/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/agritrust-public-website:latest,${{ secrets.DOCKER_USERNAME }}/agritrust-public-website:${{ github.sha }}
      
      - name: Build and push admin-dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/admin-dashboard/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/agritrust-admin-dashboard:latest,${{ secrets.DOCKER_USERNAME }}/agritrust-admin-dashboard:${{ github.sha }}
      
      - name: Build and push agent-portal
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/agent-portal/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/agritrust-agent-portal:latest,${{ secrets.DOCKER_USERNAME }}/agritrust-agent-portal:${{ github.sha }}
      
      - name: Build and push app-portal
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/app-portal/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/agritrust-app-portal:latest,${{ secrets.DOCKER_USERNAME }}/agritrust-app-portal:${{ github.sha }}
      
      - name: Build and push user-mobile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/user-mobile/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/agritrust-user-mobile:latest,${{ secrets.DOCKER_USERNAME }}/agritrust-user-mobile:${{ github.sha }}
      
      - name: Build and push driver-mobile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/driver-mobile/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/agritrust-driver-mobile:latest,${{ secrets.DOCKER_USERNAME }}/agritrust-driver-mobile:${{ github.sha }}

      - name: Build and push whatsapp-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/whatsapp-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/agritrust-whatsapp-service:latest,${{ secrets.DOCKER_USERNAME }}/agritrust-whatsapp-service:${{ github.sha }}

  # REMOVED: deploy-staging and deploy-production jobs
  # Deployment infrastructure removed - user is evaluating deployment options
