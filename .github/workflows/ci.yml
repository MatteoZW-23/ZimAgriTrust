name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit safety
      
      - name: Run security checks
        run: |
          cd backend
          bandit -r app/ -f json -o bandit-report.json || true
          safety check --json --output safety-report.json || true
      
      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
      
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json

  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd apps/admin-dashboard
          npm ci
      
      - name: Run security audit
        run: |
          cd apps/admin-dashboard
          npm audit --audit-level=moderate --json > audit-report.json || true
      
      - name: Run tests
        run: |
          cd apps/admin-dashboard
          npm test -- --coverage --watchAll=false
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3

  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies (user-mobile)
        run: |
          cd apps/user-mobile
          npm ci
      
      - name: Install dependencies (driver-mobile)
        run: |
          cd apps/driver-mobile
          npm ci
      
      - name: Run tests (user-mobile)
        run: |
          cd apps/user-mobile
          npm test -- --coverage --watchAll=false || true
      
      - name: Run tests (driver-mobile)
        run: |
          cd apps/driver-mobile
          npm test -- --coverage --watchAll=false || true

  build-and-push:
    needs: [test-backend, test-dashboard, test-mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: agritrust/backend:latest,agritrust/backend:${{ github.sha }}
          cache-from: type=registry,ref=agritrust/backend:latest
          cache-to: type=inline
      
      - name: Build and push public-website
        uses: docker/build-push-action@v4
        with:
          context: ./apps/public-website
          push: true
          tags: agritrust/public-website:latest,agritrust/public-website:${{ github.sha }}
      
      - name: Build and push admin-dashboard
        uses: docker/build-push-action@v4
        with:
          context: ./apps/admin-dashboard
          push: true
          tags: agritrust/admin-dashboard:latest,agritrust/admin-dashboard:${{ github.sha }}
      
      - name: Build and push agent-portal
        uses: docker/build-push-action@v4
        with:
          context: ./apps/agent-portal
          push: true
          tags: agritrust/agent-portal:latest,agritrust/agent-portal:${{ github.sha }}
      
      - name: Build and push app-portal
        uses: docker/build-push-action@v4
        with:
          context: ./apps/app-portal
          push: true
          tags: agritrust/app-portal:latest,agritrust/app-portal:${{ github.sha }}
      
      - name: Build and push user-mobile
        uses: docker/build-push-action@v4
        with:
          context: ./apps/user-mobile
          push: true
          tags: agritrust/user-mobile:latest,agritrust/user-mobile:${{ github.sha }}
      
      - name: Build and push driver-mobile
        uses: docker/build-push-action@v4
        with:
          context: ./apps/driver-mobile
          push: true
          tags: agritrust/driver-mobile:latest,agritrust/driver-mobile:${{ github.sha }}

      - name: Build and push whatsapp-service
        uses: docker/build-push-action@v4
        with:
          context: ./apps/whatsapp-service
          push: true
          tags: agritrust/whatsapp-service:latest,agritrust/whatsapp-service:${{ github.sha }}

  deploy-staging:
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.agritrust.com
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to staging
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/agritrust-staging
            git pull origin main
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d
            docker-compose -f docker-compose.prod.yml exec backend alembic upgrade head

      - name: Staging smoke tests
        run: |
          sleep 30
          curl -f https://staging-api.agritrust.com/health || exit 1
          curl -f https://staging-api.agritrust.com/health/ready || exit 1
          curl -f https://staging.agritrust.com/ || exit 1

  deploy-production:
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://agritrust.com
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/agritrust
            git pull origin main
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d
            docker-compose -f docker-compose.prod.yml exec backend alembic upgrade head
      
      - name: Health check
        run: |
          sleep 30
          curl -f https://api.agritrust.com/health || exit 1
          curl -f https://api.agritrust.com/health/ready || exit 1
      
      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment failed!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
