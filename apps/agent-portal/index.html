<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriTrust | Agent Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2ecc71;
            --primary-dark: #27ae60;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background-blob {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(46, 204, 113, 0.15) 0%, rgba(46, 204, 113, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
        }

        .blob-1 { top: -100px; right: -100px; }
        .blob-2 { bottom: -100px; left: -100px; }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo i { color: var(--primary); }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 5%;
        }

        header {
            margin-bottom: 3rem;
        }

        .progress-section {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            margin-bottom: 3rem;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .progress-bar-container {
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #58d68d);
            width: 35%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .module-card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .module-card:hover:not(.locked) {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .module-card.locked {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .module-status {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-size: 0.8rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        .module-card.completed .module-status {
            background: rgba(46, 204, 113, 0.2);
            color: var(--primary);
        }

        .module-number {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
        }

        .module-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .module-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            gap: 1rem;
        }

        .lock-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: var(--text-muted);
            display: none;
        }

        .locked .lock-icon { display: block; }
        .locked .content-box { opacity: 0.3; }

        .badge {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #000;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.75rem;
            display: inline-block;
            margin-bottom: 1rem;
        }

        /* Reading Interface Modal */
        #reader-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 1000;
            display: none;
            padding: 2rem 5%;
        }

        .reader-nav {
            max-width: 800px;
            margin: 0 auto 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reader-content {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 32px;
            border: 1px solid var(--border);
            max-height: 70vh;
            overflow-y: auto;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .reader-footer {
            max-width: 800px;
            margin: 2rem auto;
            display: flex;
            justify-content: space-between;
        }

        .btn {
            padding: 0.8rem 2rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

        .btn:hover { opacity: 0.9; transform: scale(1.02); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate { animation: fadeIn 0.6s ease forwards; }
    </style>
</head>
<body>
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>

    <nav>
        <div class="logo">
            <i class="fas fa-shield-halved"></i>
            AGRITRUST ACADEMY
        </div>
        <div class="user-info">
            <span id="agent-name">Agent Trainee</span>
            <i class="fas fa-circle-user fa-lg ml-2"></i>
        </div>
    </nav>

    <div class="container">
        <header class="animate">
            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Sovereign Mastery</h1>
            <p style="color: var(--text-muted);">Master the 10 core modules to become a Certified Field Agent.</p>
        </header>

        <section class="progress-section animate">
            <div class="progress-header">
                <div>
                    <h3 style="margin-bottom: 0.25rem;">Global Certification Path</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);" id="phase-text">Current Phase: Initialization</p>
                </div>
                <div style="text-align: right;">
                    <span style="font-size: 1.5rem; font-weight: 700; color: var(--primary);" id="progress-percent">0%</span>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">Progress</p>
                </div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
            </div>
        </section>

        <div class="module-grid" id="module-container">
            <!-- Dynamically populated -->
            <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
                <i class="fas fa-circle-notch fa-spin fa-2xl" style="color: var(--primary);"></i>
                <p style="margin-top: 1rem; color: var(--text-muted);">Syncing with Sovereign Ledger...</p>
            </div>
        </div>
    </div>

    <!-- Reader Interface -->
    <div id="reader-modal">
        <div class="reader-nav">
            <div>
                <button class="btn btn-outline" onclick="closeReader()"><i class="fas fa-chevron-left mr-2"></i> Exit</button>
            </div>
            <div style="text-align: center;">
                <h4 id="reader-title">Loading Topic...</h4>
                <p style="font-size: 0.8rem; color: var(--text-muted);" id="reader-page-info">---</p>
            </div>
            <div>
                <i class="fas fa-bookmark fa-lg"></i>
            </div>
        </div>

        <div class="reader-content" id="reader-body">
            <!-- Content rendered here -->
        </div>

        <div class="reader-footer">
            <button class="btn btn-outline">Previous Topic</button>
            <button class="btn btn-primary" id="mark-read-btn">Mark Topic as Read <i class="fas fa-check ml-2"></i></button>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8080/api/v1";
        let currentModules = [];
        let agentProfile = null;

        async function initAcademy() {
            const token = localStorage.getItem('agritrust_token');
            if (!token) {
                // Redirect or handle guest mode logic
                console.warn("No authentication token found. Running in demo/preview mode.");
            }

            try {
                const response = await fetch(`${API_BASE}/academy/my-progress`, {
                    headers: { 
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    agentProfile = data;
                    currentModules = data.modules;
                    
                    document.getElementById('agent-name').innerText = data.agent_name;
                    renderModules(currentModules);
                    updateProgress(currentModules);
                } else {
                    if (response.status === 401 || response.status === 403) {
                         alert("Session expired. Please log in through the application portal.");
                         // window.location.href = '../login.html';
                    }
                    throw new Error("Failed to fetch modules. Status: " + response.status);
                }
            } catch (err) {
                console.error(err);
                // Fallback to minimal UI or error state
                document.getElementById('module-container').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: #ef4444;">
                        <i class="fas fa-triangle-exclamation fa-2xl"></i>
                        <p style="margin-top: 1rem;">Unable to connect to the AgriTrust Core. Please check your connection.</p>
                    </div>
                `;
            }
        }

        function renderModules(modules) {
            const container = document.getElementById('module-container');
            container.innerHTML = '';

            modules.forEach((module, index) => {
                const isCompleted = module.completed || false;
                const isLocked = index > 0 && !modules[index-1].completed; // Basic sequential logic

                const card = document.createElement('div');
                card.className = `module-card ${isCompleted ? 'completed' : ''} ${isLocked ? 'locked' : ''} animate`;
                if (!isLocked) {
                    card.onclick = () => openReader(module);
                    if (index === 0 && !isCompleted) card.style.borderColor = 'var(--primary)';
                }

                card.innerHTML = `
                    ${isLocked ? '<i class="fas fa-lock lock-icon"></i>' : ''}
                    <div class="content-box">
                        <span class="module-status">${isCompleted ? 'Completed' : isLocked ? 'Locked' : 'Available'}</span>
                        <span class="module-number">Module ${String(module.module_number).padStart(2, '0')}</span>
                        <h3 class="module-title">${module.title}</h3>
                        <div class="module-meta">
                            <span><i class="fas fa-file-lines"></i> ${module.description.split('|')[0].trim() || 'N/A'}</span>
                            <span><i class="fas fa-clock"></i> ${module.duration_hours}h</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            
            // Add Certification Exam Placeholder
            const examCard = document.createElement('div');
            examCard.className = "module-card locked animate";
            examCard.style.background = "linear-gradient(135deg, rgba(243,156,18,0.1), rgba(243,156,18,0))";
            examCard.style.borderColor = "rgba(243,156,18,0.3)";
            examCard.innerHTML = `
                <div class="content-box">
                    <div class="badge">FINAL CERTIFICATION</div>
                    <h3 class="module-title">Official AgriTrust Exam</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Prerequisite: All 10 Modules Complete</p>
                </div>
            `;
            container.appendChild(examCard);
        }

        function updateProgress(modules) {
            const completedCount = modules.filter(m => m.completed).length;
            const percent = Math.round((completedCount / modules.length) * 100);
            
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
            
            const currentModule = modules.find(m => !m.completed) || modules[modules.length-1];
            document.getElementById('phase-text').innerText = `Current Phase: ${currentModule.title}`;
        }

        async function openReader(moduleReady, topicId = null) {
            const token = localStorage.getItem('agritrust_token');
            if (!token) return alert("Certification session required.");

            if (!topicId) {
                // Find first uncompleted topic
                const progress = moduleReady.topics_progress || {};
                const firstUncompleted = moduleReady.topics.find(t => !progress[t.id]);
                topicId = firstUncompleted ? firstUncompleted.id : moduleReady.topics[0].id;
            }

            document.getElementById('reader-modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            document.getElementById('reader-body').innerHTML = '<div style="text-align:center; padding: 5rem;"><i class="fas fa-spinner fa-spin fa-2xl"></i><p style="margin-top:1rem;">Decrypting Module Content...</p></div>';
            
            try {
                const response = await fetch(`${API_BASE}/academy/modules/${moduleReady.module_number}/topics/${topicId}/content`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!response.ok) throw new Error("Content locked or unavailable");
                
                const data = await response.json();
                document.getElementById('reader-title').innerText = data.title || moduleReady.title;
                document.getElementById('reader-page-info').innerText = `AgriTrust Internal Mastery Document | Topic ${data.topic_id}`;
                
                // Enhanced Markdown-ish Rendering
                let htmlContent = data.content
                    .replace(/^# (.*$)/gim, '<h1 style="color:var(--primary); margin-bottom:1.5rem; font-size:1.75rem;">$1</h1>')
                    .replace(/^## (.*$)/gim, '<h2 style="margin-top:2.0rem; margin-bottom:1rem; border-bottom:1px solid var(--border); padding-bottom:0.5rem; font-size:1.4rem;">$1</h2>')
                    .replace(/^### (.*$)/gim, '<h3 style="margin-top:1.5rem; margin-bottom:0.8rem; color:var(--primary); font-size:1.2rem;">$1</h3>')
                    .replace(/\*\*(.*)\*\*/gim, '<strong style="color:var(--primary);">$1</strong>')
                    .replace(/^\* (.*$)/gim, '<div style="margin-left:1rem; margin-bottom:0.5rem;"><i class="fas fa-caret-right" style="color:var(--primary); margin-right:0.5rem;"></i> $1</div>')
                    .replace(/> (.*$)/gim, '<blockquote style="border-left:4px solid var(--primary); padding:1rem; background:rgba(59,130,246,0.05); margin:1.5rem 0; font-style:italic;">$1</blockquote>')
                    .replace(/\n\n/g, '</p><p style="margin-bottom:1.2rem;">')
                    .replace(/\n/g, '<br>');

                // Add Topic Navigation inside Reader
                const currentIndex = moduleReady.topics.findIndex(t => t.id === topicId);
                const nextTopic = moduleReady.topics[currentIndex + 1];
                const prevTopic = moduleReady.topics[currentIndex - 1];

                document.getElementById('reader-body').innerHTML = `
                    <div class="content-animate" style="animation: fadeIn 0.5s ease;">
                        <p style="margin-bottom:1.2rem;">${htmlContent}</p>
                        
                        <div style="margin-top:4rem; padding-top:2rem; border-top:1px solid var(--border); display:flex; justify-content:space-between; gap:1rem;">
                            ${prevTopic ? `<button class="q-btn ghost" onclick="openReader(
                                ${JSON.stringify(moduleReady).replace(/"/g, '&quot;')}, 
                                '${prevTopic.id}'
                            )" style="flex:1;"><i class="fas fa-arrow-left"></i> Previous Topic</button>` : '<div></div>'}
                            
                            ${nextTopic ? `<button class="q-btn primary-btn" onclick="openReader(
                                ${JSON.stringify(moduleReady).replace(/"/g, '&quot;')}, 
                                '${nextTopic.id}'
                            )" style="flex:1;">Next Topic <i class="fas fa-arrow-right"></i></button>` : `
                                <button class="q-btn primary-btn" onclick="markRead(${moduleReady.module_number}, '${topicId}')" style="flex:1; background:#10b981;">Complete Module <i class="fas fa-check-double"></i></button>
                            `}
                        </div>
                    </div>
                `;

                document.getElementById('mark-read-btn').onclick = () => markRead(moduleReady.module_number, topicId);
            } catch (err) {
                console.error("Reader Error:", err);
                document.getElementById('reader-body').innerHTML = `
                    <div style="text-align:center; padding: 5rem; color:#ef4444;">
                        <i class="fas fa-lock fa-3xl"></i>
                        <h3 style="margin-top:1.5rem;">Access Restricted</h3>
                        <p style="margin-top:0.5rem; color:var(--text-muted);">This topic is currently locked or your session has expired.</p>
                        <button class="q-btn ghost" style="margin-top:2rem;" onclick="location.reload()">Reload Dashboard</button>
                    </div>
                `;
            }
        }

        function closeReader() {
            document.getElementById('reader-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        async function markRead(moduleNumber, topicId) {
            const token = localStorage.getItem('agritrust_token');
            try {
                const response = await fetch(`${API_BASE}/academy/modules/${moduleNumber}/topics/${topicId}/complete`, {
                    method: 'POST',
                    headers: { "Authorization": `Bearer ${token}` }
                });
                
                if (response.ok) {
                    alert('Progress Synced. Topic mastery recorded.');
                    closeReader();
                    initAcademy(); // Refresh dashboard
                }
            } catch (err) {
                console.error("Failed to sync progress");
            }
        }

        // Initialize on load
        window.onload = initAcademy;
    </script>
</body>
</html>
