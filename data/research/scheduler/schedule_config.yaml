# ============================================
# NOTEBOOK SCHEDULER CONFIGURATION
# ============================================

global:
  timezone: Africa/Harare
  backend_api_url: http://backend:8000/api/v1
  timeout_seconds: 3600
  log_level: INFO

jobs:
  # Job 1: Daily data cleaning at 2 AM
  - name: daily_data_cleaning
    notebook_path: notebooks/01_data/02_data_cleaning.ipynb
    schedule:
      type: cron
      cron:
        hour: 2
        minute: 0
    parameters:
      source: production_db
      output_format: parquet
    notifications:
      on_success: false
      on_failure: true

  # Job 2: Risk model training daily at 4 AM
  - name: risk_model_training
    notebook_path: notebooks/02_modeling/01_risk_scoring_model.ipynb
    schedule:
      type: cron
      cron:
        hour: 4
        minute: 0
    parameters:
      model_type: random_forest
      retrain_if_accuracy_below: 0.75
    notifications:
      on_success: true
      on_failure: true

  # Job 3: Price predictions every 6 hours
  - name: price_predictions
    notebook_path: notebooks/02_modeling/02_price_prediction_model.ipynb
    schedule:
      type: interval
      interval:
        hours: 6
    parameters:
      forecast_days: 7
      crops: [maize, soybeans, wheat]
    notifications:
      on_success: false
      on_failure: true

  # Job 4: Fraud detection every 4 hours
  - name: fraud_detection
    notebook_path: notebooks/02_modeling/03_fraud_detection_model.ipynb
    schedule:
      type: interval
      interval:
        hours: 4
    parameters:
      alert_threshold: 0.7
    notifications:
      on_success: false
      on_failure: true

  # Job 5: Weekly insights report (Monday 8 AM)
  - name: weekly_insights
    notebook_path: notebooks/04_monitoring/03_insights_dashboard.ipynb
    schedule:
      type: cron
      cron:
        day_of_week: mon
        hour: 8
        minute: 0
    parameters:
      report_format: json
      send_to_dashboard: true
    notifications:
      on_success: true
      on_failure: true

  # Job 6: Production validation (Sunday 10 PM)
  - name: production_validation
    notebook_path: notebooks/03_evaluation/04_production_readiness.ipynb
    schedule:
      type: cron
      cron:
        day_of_week: sun
        hour: 22
        minute: 0
    parameters:
      threshold: 0.75
      auto_deploy: true
    notifications:
      on_success: true
      on_failure: true
