# ─────────────────────────────────────────────────────────────────────────────
# ZimAgriTrust – Lightweight Test Stack (nginx + ngrok)
# Usage:
#   1. cp .env.local .env
#   2. docker compose -f docker-compose.ngrok.yml up --build
#   3. In a separate terminal: ngrok config add-authtoken <YOUR_TOKEN>
#                              ngrok http 80
#
# Endpoints via ngrok URL:
#   /            → public-website
#   /api/v1/...  → backend FastAPI
#   /admin/      → admin-dashboard
#   /agent/      → agent-portal
#   /app/        → app-portal
#
# Notes:
#   - Monitoring, Celery, WhatsApp, mobile services are EXCLUDED for speed.
#   - NGROK_URL env var is set at runtime; update CORS_ORIGINS if needed.
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zimagritrust
      POSTGRES_USER: ${POSTGRES_USER:-agritrust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
    expose:
      - "5432"
    volumes:
      - pgrok_postgres_data:/var/lib/postgresql/data
    networks:
      - ngrok-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agritrust} -d zimagritrust"]
      interval: 10s
      retries: 5
      timeout: 5s

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-devredis123} --appendonly yes
    expose:
      - "6379"
    volumes:
      - pgrok_redis_data:/data
    networks:
      - ngrok-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devredis123}", "ping"]
      interval: 10s
      retries: 3
      timeout: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-agritrust}:${POSTGRES_PASSWORD:-devpassword123}@postgres:5432/zimagritrust
      REDIS_URL: redis://:${REDIS_PASSWORD:-devredis123}@redis:6379/0
      APP_ENV: development
      DEBUG: "true"
      ALLOWED_HOSTS: "*"
      # Allow all origins so ngrok URL works without reconfiguring
      CORS_ORIGINS: "*"
      RATE_LIMIT_ENABLED: "false"
      ADMIN_AUDIT_LOGGING: "false"
      ADMIN_MFA_ENABLED: "false"
      MASTER_TEST_LOGIN_ENABLED: "true"
      AUTO_CONFIRM_PAYMENTS: "false"
    volumes:
      - ./backend:/app
    networks:
      - ngrok-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  public-website:
    build:
      context: .
      dockerfile: apps/public-website/Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 3000
    expose:
      - "3000"
    environment:
      VITE_API_URL: /api/v1
    volumes:
      - ./apps/public-website/src:/app/src
    networks:
      - ngrok-net
    depends_on:
      - backend
    restart: unless-stopped

  admin-dashboard:
    build:
      context: .
      dockerfile: apps/admin-dashboard/Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 3001
    expose:
      - "3001"
    environment:
      VITE_API_URL: /api/v1
    volumes:
      - ./apps/admin-dashboard/src:/app/src
    networks:
      - ngrok-net
    depends_on:
      - backend
    restart: unless-stopped

  agent-portal:
    build:
      context: .
      dockerfile: apps/agent-portal/Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 3002
    expose:
      - "3002"
    environment:
      VITE_API_URL: /api/v1
    volumes:
      - ./apps/agent-portal/src:/app/src
    networks:
      - ngrok-net
    depends_on:
      - backend
    restart: unless-stopped

  app-portal:
    build:
      context: .
      dockerfile: apps/app-portal/Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 3003
    expose:
      - "3003"
    environment:
      VITE_API_URL: /api/v1
    volumes:
      - ./apps/app-portal/src:/app/src
    networks:
      - ngrok-net
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.ngrok.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ngrok-net
    depends_on:
      - backend
      - public-website
      - admin-dashboard
      - agent-portal
      - app-portal
    restart: unless-stopped

volumes:
  pgrok_postgres_data:
  pgrok_redis_data:

networks:
  ngrok-net:
    driver: bridge
