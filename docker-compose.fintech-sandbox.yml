version: '3.8'

services:
  # PostgreSQL Database
  postgres-sandbox:
    image: postgres:15-alpine
    container_name: zimagritrust-postgres-sandbox
    environment:
      POSTGRES_DB: zimagritrust_sandbox
      POSTGRES_USER: agritrust_sandbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sandbox_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_sandbox_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agritrust_sandbox"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintech-sandbox-network

  # Redis for caching and queues
  redis-sandbox:
    image: redis:7-alpine
    container_name: zimagritrust-redis-sandbox
    ports:
      - "6380:6379"
    volumes:
      - redis_sandbox_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintech-sandbox-network

  # Backend API with Fintech Sandbox
  backend-sandbox:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production-slim
    container_name: zimagritrust-backend-sandbox
    environment:
      - DATABASE_URL=postgresql://agritrust_sandbox:${POSTGRES_PASSWORD:-sandbox_dev_password}@postgres-sandbox:5432/zimagritrust_sandbox
      - REDIS_URL=redis://redis-sandbox:6379/0
      - SECRET_KEY=${SECRET_KEY:-sandbox_secret_key_change_in_production}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY:-sandbox_refresh_secret_change_in_production}
      - ADMIN_BOOTSTRAP_TOKEN=${ADMIN_BOOTSTRAP_TOKEN:-sandbox_admin_token}
      - ENVIRONMENT=sandbox
      - MOCK_PAYMENT_PROVIDERS=true
      - ENABLE_FINTECH_SANDBOX=true
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - shared_models:/app/models:ro
    depends_on:
      postgres-sandbox:
        condition: service_healthy
      redis-sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fintech-sandbox-network

  # Prometheus for metrics collection
  prometheus-sandbox:
    image: prom/prometheus:latest
    container_name: zimagritrust-prometheus-sandbox
    ports:
      - "9091:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus-sandbox.yml:/etc/prometheus/prometheus.yml
      - prometheus_sandbox_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - fintech-sandbox-network

  # Grafana for dashboards
  grafana-sandbox:
    image: grafana/grafana:latest
    container_name: zimagritrust-grafana-sandbox
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-sandbox_grafana}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_sandbox_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus-sandbox
    networks:
      - fintech-sandbox-network

  # Queue Worker for background jobs
  queue-worker-sandbox:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production-slim
    container_name: zimagritrust-queue-worker-sandbox
    environment:
      - DATABASE_URL=postgresql://agritrust_sandbox:${POSTGRES_PASSWORD:-sandbox_dev_password}@postgres-sandbox:5432/zimagritrust_sandbox
      - REDIS_URL=redis://redis-sandbox:6379/0
      - SECRET_KEY=${SECRET_KEY:-sandbox_secret_key_change_in_production}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY:-sandbox_refresh_secret_change_in_production}
      - ENVIRONMENT=sandbox
      - MOCK_PAYMENT_PROVIDERS=true
      - ENABLE_FINTECH_SANDBOX=true
      - WORKER_MODE=true
    volumes:
      - ./backend:/app
      - shared_models:/app/models:ro
    depends_on:
      - postgres-sandbox
      - redis-sandbox
    command: python -m app.workers.queue_worker
    networks:
      - fintech-sandbox-network

  # Reconciliation Worker
  reconciliation-worker-sandbox:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production-slim
    container_name: zimagritrust-reconciliation-worker-sandbox
    environment:
      - DATABASE_URL=postgresql://agritrust_sandbox:${POSTGRES_PASSWORD:-sandbox_dev_password}@postgres-sandbox:5432/zimagritrust_sandbox
      - REDIS_URL=redis://redis-sandbox:6379/0
      - SECRET_KEY=${SECRET_KEY:-sandbox_secret_key_change_in_production}
      - ENVIRONMENT=sandbox
      - MOCK_PAYMENT_PROVIDERS=true
      - ENABLE_FINTECH_SANDBOX=true
      - RECONCILIATION_WORKER=true
    volumes:
      - ./backend:/app
      - shared_models:/app/models:ro
    depends_on:
      - postgres-sandbox
      - redis-sandbox
    command: python -m app.workers.reconciliation_worker
    networks:
      - fintech-sandbox-network

volumes:
  postgres_sandbox_data:
  redis_sandbox_data:
  prometheus_sandbox_data:
  grafana_sandbox_data:
  shared_models:

networks:
  fintech-sandbox-network:
    driver: bridge
