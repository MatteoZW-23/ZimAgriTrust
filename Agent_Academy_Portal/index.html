<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriTrust | Agent Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2ecc71;
            --primary-dark: #27ae60;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background-blob {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(46, 204, 113, 0.15) 0%, rgba(46, 204, 113, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
        }

        .blob-1 { top: -100px; right: -100px; }
        .blob-2 { bottom: -100px; left: -100px; }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo i { color: var(--primary); }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 5%;
        }

        header {
            margin-bottom: 3rem;
        }

        .progress-section {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            margin-bottom: 3rem;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .progress-bar-container {
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #58d68d);
            width: 35%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .module-card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .module-card:hover:not(.locked) {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .module-card.locked {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .module-status {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-size: 0.8rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        .module-card.completed .module-status {
            background: rgba(46, 204, 113, 0.2);
            color: var(--primary);
        }

        .module-number {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
        }

        .module-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .module-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            gap: 1rem;
        }

        .lock-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: var(--text-muted);
            display: none;
        }

        .locked .lock-icon { display: block; }
        .locked .content-box { opacity: 0.3; }

        .badge {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #000;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.75rem;
            display: inline-block;
            margin-bottom: 1rem;
        }

        /* Reading Interface Modal */
        #reader-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 1000;
            display: none;
            padding: 2rem 5%;
        }

        .reader-nav {
            max-width: 800px;
            margin: 0 auto 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reader-content {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 32px;
            border: 1px solid var(--border);
            max-height: 70vh;
            overflow-y: auto;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .reader-footer {
            max-width: 800px;
            margin: 2rem auto;
            display: flex;
            justify-content: space-between;
        }

        .btn {
            padding: 0.8rem 2rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

        .btn:hover { opacity: 0.9; transform: scale(1.02); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate { animation: fadeIn 0.6s ease forwards; }
    </style>
</head>
<body>
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>

    <nav>
        <div class="logo">
            <i class="fas fa-shield-halved"></i>
            AGRITRUST ACADEMY
        </div>
        <div class="user-info">
            <span id="agent-name">Agent Trainee</span>
            <i class="fas fa-circle-user fa-lg ml-2"></i>
        </div>
    </nav>

    <div class="container">
        <header class="animate">
            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Sovereign Mastery</h1>
            <p style="color: var(--text-muted);">Master the 10 core modules to become a Certified Field Agent.</p>
        </header>

        <section class="progress-section animate">
            <div class="progress-header">
                <div>
                    <h3 style="margin-bottom: 0.25rem;">Global Certification Path</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);" id="phase-text">Current Phase: Initialization</p>
                </div>
                <div style="text-align: right;">
                    <span style="font-size: 1.5rem; font-weight: 700; color: var(--primary);" id="progress-percent">0%</span>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">Progress</p>
                </div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
            </div>
        </section>

        <div class="module-grid" id="module-container">
            <!-- Dynamically populated -->
            <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
                <i class="fas fa-circle-notch fa-spin fa-2xl" style="color: var(--primary);"></i>
                <p style="margin-top: 1rem; color: var(--text-muted);">Syncing with Sovereign Ledger...</p>
            </div>
        </div>
    </div>

    <!-- Reader Interface -->
    <div id="reader-modal">
        <div class="reader-nav">
            <div>
                <button class="btn btn-outline" onclick="closeReader()"><i class="fas fa-chevron-left mr-2"></i> Exit</button>
            </div>
            <div style="text-align: center;">
                <h4 id="reader-title">Loading Topic...</h4>
                <p style="font-size: 0.8rem; color: var(--text-muted);" id="reader-page-info">---</p>
            </div>
            <div>
                <i class="fas fa-bookmark fa-lg"></i>
            </div>
        </div>

        <div class="reader-content" id="reader-body">
            <!-- Content rendered here -->
        </div>

        <div class="reader-footer">
            <button class="btn btn-outline">Previous Topic</button>
            <button class="btn btn-primary" id="mark-read-btn">Mark Topic as Read <i class="fas fa-check ml-2"></i></button>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8080/api/v1";
        let currentModules = [];
        let agentProfile = null;

        async function initAcademy() {
            const token = localStorage.getItem('agritrust_token');
            if (!token) {
                // Redirect or handle guest mode logic
                console.warn("No authentication token found. Running in demo/preview mode.");
            }

            try {
                // In a real deployment, we fetch modules and agent status
                const response = await fetch(`${API_BASE}/onboarding/academy/modules`, {
                    headers: token ? { "Authorization": `Bearer ${token}` } : {}
                });
                
                if (response.ok) {
                    currentModules = await response.json();
                    renderModules(currentModules);
                    updateProgress(currentModules);
                } else {
                    throw new Error("Failed to fetch modules");
                }
            } catch (err) {
                console.error(err);
                // Fallback to minimal UI or error state
                document.getElementById('module-container').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: #ef4444;">
                        <i class="fas fa-triangle-exclamation fa-2xl"></i>
                        <p style="margin-top: 1rem;">Unable to connect to the AgriTrust Core. Please check your connection.</p>
                    </div>
                `;
            }
        }

        function renderModules(modules) {
            const container = document.getElementById('module-container');
            container.innerHTML = '';

            modules.forEach((module, index) => {
                const isCompleted = module.completed || false;
                const isLocked = index > 0 && !modules[index-1].completed; // Basic sequential logic

                const card = document.createElement('div');
                card.className = `module-card ${isCompleted ? 'completed' : ''} ${isLocked ? 'locked' : ''} animate`;
                if (!isLocked) {
                    card.onclick = () => openReader(module);
                    if (index === 0 && !isCompleted) card.style.borderColor = 'var(--primary)';
                }

                card.innerHTML = `
                    ${isLocked ? '<i class="fas fa-lock lock-icon"></i>' : ''}
                    <div class="content-box">
                        <span class="module-status">${isCompleted ? 'Completed' : isLocked ? 'Locked' : 'Available'}</span>
                        <span class="module-number">Module ${String(module.module_number).padStart(2, '0')}</span>
                        <h3 class="module-title">${module.title}</h3>
                        <div class="module-meta">
                            <span><i class="fas fa-file-lines"></i> ${module.description.split('|')[0].trim() || 'N/A'}</span>
                            <span><i class="fas fa-clock"></i> ${module.duration_hours}h</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            
            // Add Certification Exam Placeholder
            const examCard = document.createElement('div');
            examCard.className = "module-card locked animate";
            examCard.style.background = "linear-gradient(135deg, rgba(243,156,18,0.1), rgba(243,156,18,0))";
            examCard.style.borderColor = "rgba(243,156,18,0.3)";
            examCard.innerHTML = `
                <div class="content-box">
                    <div class="badge">FINAL CERTIFICATION</div>
                    <h3 class="module-title">Official AgriTrust Exam</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Prerequisite: All 10 Modules Complete</p>
                </div>
            `;
            container.appendChild(examCard);
        }

        function updateProgress(modules) {
            const completedCount = modules.filter(m => m.completed).length;
            const percent = Math.round((completedCount / modules.length) * 100);
            
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
            
            const currentModule = modules.find(m => !m.completed) || modules[modules.length-1];
            document.getElementById('phase-text').innerText = `Current Phase: ${currentModule.title}`;
        }

        function openReader(moduleReady) {
            document.getElementById('reader-modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            
            document.getElementById('reader-title').innerText = moduleReady.title;
            const topic = moduleReady.topics?.[0] || { title: "Overview", pages: 0, content: "Content loading from secure vault..." };
            
            document.getElementById('reader-page-info').innerText = `${topic.pages} Pages in this Unit`;
            
            const content = topic.content || "Standard curriculum content is currently being decrypted for your secure session.";
            // Simple markdown-ish to HTML conversion for demo
            document.getElementById('reader-body').innerHTML = `
                <h2>${topic.title}</h2>
                <div style="margin-top: 1.5rem; white-space: pre-wrap;">${content}</div>
            `;

            document.getElementById('mark-read-btn').onclick = () => markRead(moduleReady.id);
        }

        function closeReader() {
            document.getElementById('reader-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        async function markRead(moduleId) {
            // In recruitment mode, this would ping the quiz endpoint or progress endpoint
            alert('Progress Synced. Certification Path Updated.');
            closeReader();
        }

        // Initialize on load
        window.onload = initAcademy;
    </script>
</body>
</html>
