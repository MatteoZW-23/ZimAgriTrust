# ─────────────────────────────────────────────────────────────────────────────
# ZimAgriTrust – Nginx config for local test deployment via ngrok
# Accepts any hostname (server_name _) so ngrok tunnels work without changes.
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    gzip          on;
    gzip_vary     on;
    gzip_proxied  any;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    keepalive_timeout 65;
    client_max_body_size 20m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Common proxy headers snippet (repeated inline for compatibility) ──────
    # ngrok sends X-Forwarded-Proto: https — pass it through so the app knows.

    # ── Upstream services ─────────────────────────────────────────────────────
    upstream backend        { server backend:8000;        keepalive 16; }
    upstream public_website { server public-website:3000; }
    upstream admin_dash     { server admin-dashboard:3001; }
    upstream agent_portal   { server agent-portal:3002; }
    upstream app_portal     { server app-portal:3003; }

    server {
        listen 80;
        server_name _;   # Accept any hostname, including *.ngrok-free.app

        # ── API ──────────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # ── App portal (/app/) ───────────────────────────────────────────────
        location /app {
            return 302 /app/;
        }
        location /app/ {
            proxy_pass         http://app_portal/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # ── Agent portal (/agent/) ───────────────────────────────────────────
        location /agent {
            return 302 /agent/;
        }
        location /agent/ {
            proxy_pass         http://agent_portal/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # ── Admin dashboard (/admin/) ─────────────────────────────────────────
        location /admin {
            return 302 /admin/;
        }
        location /admin/ {
            proxy_pass         http://admin_dash/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # ── Public website (/) ───────────────────────────────────────────────
        location / {
            proxy_pass         http://public_website;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
