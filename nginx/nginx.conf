##############################################################
# ZimAgritrust – Nginx Reverse Proxy with Subdomains
# 
# Main Domain Routes:
#   /              → public-website (port 3000)
#   /app/*         → app-portal (port 3003) - Farmer/Buyer web dashboard
#   /driver/*      → mobile-download/info only; drivers use mobile app
#   /agent/*       → agent-portal (port 3002)
#   /admin/*       → admin-dashboard (port 3001)
#   /api/*         → backend FastAPI (port 8000)
#
# Subdomain Routes:
#   admin.<domain> → admin-dashboard (port 3001)
#   agent.<domain> → agent-portal (port 3002)
#
# Note: Drivers (transporters) are MOBILE ONLY - no web access
# They must use the separate driver-mobile app
##############################################################

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    gzip          on;
    gzip_vary     on;
    gzip_min_length 1024;
    gzip_proxied  any;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Timeouts ──────────────────────────────────────────────────────────────
    keepalive_timeout         65;
    client_header_timeout     15s;
    client_body_timeout       30s;
    send_timeout              30s;
    proxy_connect_timeout     10s;
    proxy_send_timeout        60s;
    proxy_read_timeout        60s;

    # ── Body size limits ──────────────────────────────────────────────────────
    client_max_body_size      10m;
    client_body_buffer_size   128k;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # General API: 30 req/s per IP (burst 60 allows mobile retry storms)
    limit_req_zone $binary_remote_addr zone=api_general:20m  rate=30r/s;
    # Auth endpoints: strict 5 req/s (brute force protection)
    limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=5r/s;
    # Webhook endpoints: 20 req/s (providers retry frequently)
    limit_req_zone $binary_remote_addr zone=api_webhook:10m  rate=20r/s;
    # Payment endpoints: 10 req/s
    limit_req_zone $binary_remote_addr zone=api_payment:10m  rate=10r/s;

    # ── Connection limiting ───────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Log format ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Upstream services ──────────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }
    upstream public_website  { server public-website:3000; }
    upstream admin_dashboard { server admin-dashboard:3001; }
    upstream agent_portal    { server agent-portal:3002; }
    upstream app_portal      { server app-portal:3003; }

    # ── Shared proxy headers macro ────────────────────────────────────────────
    # Applied to all proxy_pass blocks via the named location pattern below.

    # ── Main server (root domain) ────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Connection limit per IP
        limit_conn conn_limit 100;

        # ── API passthrough ──────────────────────────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location ~ ^/api/v1/payments/(ecocash|onemoney)/callback {
            limit_req zone=api_webhook burst=40 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location ~ ^/api/v1/(payments|wallet|deposits|withdrawals|orders) {
            limit_req zone=api_payment burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location /api/ {
            limit_req zone=api_general burst=60 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # ── Farmer/Buyer web dashboard (/app/*) ──────────────────────────────
        location /app {
            return 302 /app/;
        }
        location /app/ {
            proxy_pass         http://app_portal/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Driver information path. Drivers authenticate in the mobile app. ─
        location /driver {
            return 302 /driver/;
        }
        location /driver/ {
            proxy_pass         http://public_website/download-mobile-app;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Isolated Agent/Admin web portals on root-domain paths ─────────────
        location /agent {
            return 302 /agent/;
        }
        location /agent/ {
            proxy_pass         http://agent_portal/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /admin {
            return 302 /admin/;
        }
        location /admin/ {
            proxy_pass         http://admin_dashboard/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Public website (/) ───────────────────────────────────────────────
        location / {
            proxy_pass         http://public_website;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ── Admin subdomain (admin.<domain>) ──────────────────────────────────────
    server {
        listen 80;
        server_name admin.localhost;

        location / {
            proxy_pass         http://admin_dashboard;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }
    }

    # ── Agent subdomain (agent.<domain>) ────────────────────────────────────────
    server {
        listen 80;
        server_name agent.localhost;

        location / {
            proxy_pass         http://agent_portal;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }
    }
}
