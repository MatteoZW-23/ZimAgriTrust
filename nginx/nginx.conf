user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    
    # Upstream servers
    upstream backend {
        server backend:8000;
        keepalive 32;
    }
    
    upstream public_website {
        server public-website:3000;
        keepalive 32;
    }
    
    upstream admin_dashboard {
        server admin-dashboard:3001;
        keepalive 32;
    }
    
    upstream agent_portal {
        server agent-portal:3002;
        keepalive 32;
    }
    
    upstream app_portal {
        server app-portal:3003;
        keepalive 32;
    }
    
    upstream supplier_portal {
        server supplier-portal:3004;
        keepalive 32;
    }
    
    upstream flower {
        server flower:5555;
        keepalive 16;
    }
    
    upstream prometheus {
        server prometheus:9090;
        keepalive 16;
    }
    
    upstream grafana {
        server grafana:3000;
        keepalive 16;
    }

    # Include site-specific configurations
    include /etc/nginx/conf.d/*.conf;
}
