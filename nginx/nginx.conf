##############################################################
# ZimAgritrust – Nginx Reverse Proxy with Subdomains
# 
# Main Domain Routes:
#   /              → public-website (port 3000)
#   /dashboard/*   → app-portal (port 3003) - Farmer/Buyer web dashboard
#   /api/*         → backend FastAPI (port 8000)
#
# Subdomain Routes:
#   admin.<domain> → admin-dashboard (port 3001)
#   agent.<domain> → agent-portal (port 3002)
#
# Note: Drivers (transporters) are MOBILE ONLY - no web access
# They must use the separate driver-mobile app
##############################################################

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Upstream services ──────────────────────────────────────────────────────
    upstream backend         { server backend:8000; }
    upstream public_website  { server public-website:3000; }
    upstream admin_dashboard { server admin-dashboard:3001; }
    upstream agent_portal    { server agent-portal:3002; }
    upstream app_portal      { server app-portal:3003; }

    # ── Main server (root domain) ────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # ── API passthrough ──────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # ── Farmer/Buyer web dashboard (/dashboard/*) ────────────────────────
        location /dashboard {
            return 302 /dashboard/;
        }
        location /dashboard/ {
            proxy_pass         http://app_portal/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Public website (/) ───────────────────────────────────────────────
        location / {
            proxy_pass         http://public_website;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ── Admin subdomain (admin.<domain>) ──────────────────────────────────────
    server {
        listen 80;
        server_name admin.localhost;

        location / {
            proxy_pass         http://admin_dashboard;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }
    }

    # ── Agent subdomain (agent.<domain>) ────────────────────────────────────────
    server {
        listen 80;
        server_name agent.localhost;

        location / {
            proxy_pass         http://agent_portal;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }
    }
}
