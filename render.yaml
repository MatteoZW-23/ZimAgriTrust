# Render.com Blueprint for ZimAgriTrust Demo
# Deploy at: https://render.com/blueprints

services:
  # Backend API Service
  - type: web
    name: agritrust-backend
    runtime: docker
    repo: https://github.com/sammy2324mathy/ZimAgriTrust
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agritrust-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agritrust-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET_KEY
        generateValue: true
      - key: PIN_PEPPER
        generateValue: true
      - key: ADMIN_BOOTSTRAP_TOKEN
        value: demo-bootstrap-token-32-chars-long
      - key: APP_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: CORS_ORIGINS
        value: "*"
      - key: ALLOWED_HOSTS
        value: "*"
    healthCheckPath: /health
    plan: free

  # Redis Cache
  - type: redis
    name: agritrust-redis
    plan: free
    ipAllowList: []  # Allow all (for demo only)

  # Frontend - Public Website
  - type: web
    name: agritrust-website
    runtime: static
    buildCommand: cd apps/public-website && npm install && npm run build
    publishPath: ./apps/public-website/dist
    envVars:
      - key: VITE_API_URL
        value: https://agritrust-backend.onrender.com/api/v1
    plan: free

  # Frontend - App Portal
  - type: web
    name: agritrust-app
    runtime: static
    buildCommand: cd apps/app-portal && npm install && npm run build
    publishPath: ./apps/app-portal/dist
    envVars:
      - key: VITE_API_URL
        value: https://agritrust-backend.onrender.com/api/v1
    plan: free

databases:
  # PostgreSQL Database
  - name: agritrust-db
    plan: free
    databaseName: agritrust_demo
    user: agritrust
