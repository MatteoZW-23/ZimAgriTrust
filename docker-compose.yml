

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agri_trust
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
      timeout: 5s

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  whatsapp-service:
    build: ./apps/whatsapp-service
    ports:
      - "8001:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:3006
      MAIN_BACKEND_URL: http://backend:8000
      LOG_LEVEL: INFO
    depends_on:
      - redis
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: production-slim
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/agri_trust
      REDIS_URL: redis://redis:6379/0
      WHATSAPP_SERVICE_URL: http://whatsapp-service:8000
      WHATSAPP_USE_REDIS: "false"
      SECRET_KEY: test-key-replace-in-prod
      CORS_ORIGINS: "*"
      ALLOWED_HOSTS: "*"
      # Force polling needed on Windows — inotify events don't cross WSL2/Hyper-V volume boundary
      WATCHFILES_FORCE_POLLING: "true"
      # Security Configuration
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: "100"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      ADMIN_RATE_LIMIT_REQUESTS: "30"
      ADMIN_RATE_LIMIT_WINDOW_SECONDS: "60"
      ADMIN_IP_WHITELIST: ""
      ADMIN_SESSION_TIMEOUT_MINUTES: "30"
      ADMIN_MFA_ENABLED: "false"
      ADMIN_AUDIT_LOGGING: "true"
      ACCOUNT_LOCKOUT_ENABLED: "true"
      ACCOUNT_LOCKOUT_ATTEMPTS: "5"
      ACCOUNT_LOCKOUT_DURATION_MINUTES: "30"
      PASSWORD_MIN_LENGTH: "8"
      PASSWORD_REQUIRE_UPPERCASE: "true"
      PASSWORD_REQUIRE_LOWERCASE: "true"
      PASSWORD_REQUIRE_DIGIT: "true"
      PASSWORD_REQUIRE_SPECIAL: "true"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
      REQUIRE_MFA_ADMIN: "true"
    volumes:
      - ./backend:/app
      - ./data/ml-weights:/app/ml_weights
      - shared_models:/app/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  public-website:
    build:
      context: .
      dockerfile: apps/public-website/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
      - VITE_ADMIN_URL=http://localhost:3001
      - VITE_AGENT_URL=http://localhost:3002
      - VITE_APP_PORTAL_URL=http://localhost:3003
    volumes:
      - ./apps/public-website:/app
      - /app/node_modules
    depends_on:
      - backend

  admin-dashboard:
    build:
      context: .
      dockerfile: apps/admin-dashboard/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    volumes:
      - ./apps/admin-dashboard:/app
      - /app/node_modules
    depends_on:
      - backend

  agent-portal:
    build:
      context: .
      dockerfile: apps/agent-portal/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    volumes:
      - ./apps/agent-portal:/app
      - /app/node_modules
    depends_on:
      - backend

  app-portal:
    build:
      context: .
      dockerfile: apps/app-portal/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    volumes:
      - ./apps/app-portal:/app
      - /app/node_modules
    depends_on:
      - backend

  # User Mobile App (Farmer + Buyer) - Development only
  # Mobile apps typically run with Expo outside Docker for development
  # Use: cd apps/user-mobile && npm start
  user-mobile:
    build: ./apps/user-mobile
    ports:
      - "19000:19000"
      - "19001:19001"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:8080/api/v1
      - EXPO_PUBLIC_APP_KIND=farmer_buyer
    volumes:
      - ./apps/user-mobile:/app
      - /app/node_modules
    depends_on:
      - backend

  # Driver Mobile App (Driver Only) - Development only
  # Mobile apps typically run with Expo outside Docker for development
  # Use: cd apps/driver-mobile && npm start
  driver-mobile:
    build: ./apps/driver-mobile
    ports:
      - "19002:19006"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:8080/api/v1
      - EXPO_PUBLIC_APP_KIND=driver
    volumes:
      - ./apps/driver-mobile:/app
      - /app/node_modules
    depends_on:
      - backend

  node-gateway:
    build: ./apps/iot-gateway
    ports:
      - "3005:3005"
    depends_on:
      - backend

  ussd-simulator:
    build: ./apps/ussd-simulator
    ports:
      - "5000:5000"
    environment:
      - BACKEND_URL=http://backend:8000
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-default-dev-secret-key-change-in-production}
    volumes:
      - ./apps/ussd-simulator:/app
    depends_on:
      - backend

  whatsapp-bridge:
    build: ./apps/whatsapp-bridge
    ports:
      - "3006:3006"
    environment:
      - BACKEND_URL=http://backend:8000/api/v1/whatsapp/webhook
      - PORT=3006
    volumes:
      - ./apps/whatsapp-bridge:/app
      - /app/node_modules
      - wwebjs_auth:/app/.wwebjs_auth
      - wwebjs_cache:/app/.wwebjs_cache
    depends_on:
      - backend
    restart: always

  # ── Jupyter Research Environment (DEVELOPMENT ONLY — large, ~3-5GB) ────────
  # Contains PyTorch, YOLOv8, TensorFlow — NEVER used in production
  # Access: http://localhost:8888  token: zimagritrust
  jupyter:
    build:
      context: ./jupyter
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./jupyter/notebooks:/workspace/notebooks
      - ./jupyter/scripts:/workspace/scripts
      - ./jupyter/data:/workspace/data
      - shared_models:/workspace/exports/models
    environment:
      - JUPYTER_ENABLE_LAB=yes
    depends_on:
      - postgres
    profiles:
      - dev
    restart: unless-stopped


volumes:
  postgres_data:
  wwebjs_auth:
  wwebjs_cache:
  shared_models:
    driver: local
