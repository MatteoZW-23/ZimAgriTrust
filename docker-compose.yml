

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agri_trust
      POSTGRES_USER: ${POSTGRES_USER:-agritrust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    expose:
      - "5432"  # Internal only - no host port mapping in production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      retries: 5
      timeout: 5s
    # NO ports: mapping in production - use docker-compose exec for access

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_in_production} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"  # Internal only - no host port mapping
    volumes:
      - redis_data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      retries: 3
      timeout: 5s
    restart: unless-stopped

  whatsapp-service:
    build: ./apps/whatsapp-service
    ports:
      - "8001:8000"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:3006
      MAIN_BACKEND_URL: http://backend:8000
      LOG_LEVEL: INFO
    networks:
      - backend-network
    depends_on:
      - redis
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: production-slim
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-agritrust}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/agri_trust
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      WHATSAPP_SERVICE_URL: http://whatsapp-service:8000
      WHATSAPP_USE_REDIS: "false"
      APP_ENV: development
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      # Security Configuration
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: "100"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      ADMIN_RATE_LIMIT_REQUESTS: "30"
      ADMIN_RATE_LIMIT_WINDOW_SECONDS: "60"
      ADMIN_IP_WHITELIST: ""
      ADMIN_SESSION_TIMEOUT_MINUTES: "30"
      ADMIN_MFA_ENABLED: "false"
      ADMIN_AUDIT_LOGGING: "true"
      ACCOUNT_LOCKOUT_ENABLED: "true"
      ACCOUNT_LOCKOUT_ATTEMPTS: "5"
      ACCOUNT_LOCKOUT_DURATION_MINUTES: "30"
      PASSWORD_MIN_LENGTH: "8"
      PASSWORD_REQUIRE_UPPERCASE: "true"
      PASSWORD_REQUIRE_LOWERCASE: "true"
      PASSWORD_REQUIRE_DIGIT: "true"
      PASSWORD_REQUIRE_SPECIAL: "true"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
      REQUIRE_MFA_ADMIN: "true"
      # Gunicorn tuning
      GUNICORN_WORKERS: "4"
      GUNICORN_TIMEOUT: "60"
      GUNICORN_MAX_REQUESTS: "1000"
      GUNICORN_MAX_REQUESTS_JITTER: "100"
      # DB pool
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      DB_POOL_TIMEOUT: "30"
      DB_STATEMENT_TIMEOUT_MS: "30000"
      AUTO_CONFIRM_PAYMENTS: "false"
      MASTER_TEST_LOGIN_ENABLED: "false"
    volumes:
      - ./data/ml-weights:/app/ml_weights
      - ./data/training-materials:/app/data/training-materials
      - shared_models:/app/models
    networks:
      - backend-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  public-website:
    build:
      context: .
      dockerfile: apps/public-website/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
      - VITE_ADMIN_URL=http://localhost:3001
      - VITE_AGENT_URL=http://localhost:3002
      - VITE_APP_PORTAL_URL=http://localhost:3003
    volumes:
      - ./apps/public-website:/app
      - /app/node_modules
    depends_on:
      - backend

  admin-dashboard:
    build:
      context: .
      dockerfile: apps/admin-dashboard/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    volumes:
      - ./apps/admin-dashboard:/app
      - /app/node_modules
    depends_on:
      - backend

  agent-portal:
    build:
      context: .
      dockerfile: apps/agent-portal/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    volumes:
      - ./apps/agent-portal:/app
      - /app/node_modules
    depends_on:
      - backend

  app-portal:
    build:
      context: .
      dockerfile: apps/app-portal/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    volumes:
      - ./apps/app-portal:/app
      - /app/node_modules
    depends_on:
      - backend

  supplier-portal:
    build:
      context: .
      dockerfile: apps/supplier-portal/Dockerfile
    ports:
      - "3004:3004"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    volumes:
      - ./apps/supplier-portal:/app
      - /app/node_modules
    depends_on:
      - backend

  # User Mobile App (Farmer + Buyer) - Development only
  # Mobile apps typically run with Expo outside Docker for development
  # Use: cd apps/user-mobile && npm start
  user-mobile:
    build: ./apps/user-mobile
    ports:
      - "19000:19000"
      - "19001:19001"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:8080/api/v1
      - EXPO_PUBLIC_APP_KIND=farmer_buyer
    volumes:
      - ./apps/user-mobile:/app
      - /app/node_modules
    depends_on:
      - backend

  # Driver Mobile App (Driver Only) - Development only
  # Mobile apps typically run with Expo outside Docker for development
  # Use: cd apps/driver-mobile && npm start
  driver-mobile:
    build: ./apps/driver-mobile
    ports:
      - "19002:19006"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:8080/api/v1
      - EXPO_PUBLIC_APP_KIND=driver
    volumes:
      - ./apps/driver-mobile:/app
      - /app/node_modules
    depends_on:
      - backend

  node-gateway:
    build: ./apps/iot-gateway
    ports:
      - "3005:3005"
    depends_on:
      - backend

  ussd-simulator:
    build: ./apps/ussd-simulator
    ports:
      - "5000:5000"
    environment:
      - BACKEND_URL=http://backend:8000
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-default-dev-secret-key-change-in-production}
    volumes:
      - ./apps/ussd-simulator:/app
    depends_on:
      - backend

  whatsapp-bridge:
    build: ./apps/whatsapp-bridge
    ports:
      - "3006:3006"
    environment:
      - BACKEND_URL=http://backend:8000/api/v1/whatsapp/webhook
      - PORT=3006
    volumes:
      - ./apps/whatsapp-bridge:/app
      - /app/node_modules
      - wwebjs_auth:/app/.wwebjs_auth
      - wwebjs_cache:/app/.wwebjs_cache
    depends_on:
      - backend
    restart: always

  # ── Jupyter Research Environment (DEVELOPMENT ONLY — large, ~3-5GB) ────────
  # Contains PyTorch, YOLOv8, TensorFlow — NEVER used in production
  # Access: http://localhost:8888  token: zimagritrust
  jupyter:
    build:
      context: ./jupyter
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./jupyter/notebooks:/workspace/notebooks
      - ./jupyter/scripts:/workspace/scripts
      - ./jupyter/data:/workspace/data
      - shared_models:/workspace/exports/models
    environment:
      - JUPYTER_ENABLE_LAB=yes
    depends_on:
      - postgres
    profiles:
      - dev
    restart: unless-stopped


volumes:
  postgres_data:
  wwebjs_auth:
  wwebjs_cache:
  shared_models:
    driver: local
  redis_data:

networks:
  backend-network:
    driver: bridge
