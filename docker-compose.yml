

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agri_trust
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
      timeout: 5s

  redis:
    image: redis:7
    ports:
    
      - "6380:6379"

  backend:
    build: ./backend
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/agri_trust
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: test-key-replace-in-prod
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5000,http://localhost:5173,http://localhost:19006
      ALLOWED_HOSTS: "*"
      # Limit watchfiles to only the app source — prevents inotify exhaustion
      WATCHFILES_FORCE_POLLING: "false"
    volumes:
      - ./backend:/app
      - ./data/ml-weights:/app/ml_weights
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    sysctls:
      - fs.inotify.max_user_watches=524288
      - fs.inotify.max_user_instances=512
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  node-gateway:
    build: ./apps/iot-gateway
    ports:
      - "3005:3005"
    depends_on:
      - backend

  agent-dashboard:
    build: ./apps/admin-dashboard
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    volumes:
      - ./apps/admin-dashboard:/app
      - /app/node_modules
    depends_on:
      - backend

  ussd-simulator:
    build: ./apps/ussd-simulator
    ports:
      - "5000:5000"
    environment:
      - BACKEND_URL=http://backend:8000
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-default-dev-secret-key-change-in-production}
    volumes:
      - ./apps/ussd-simulator:/app
    depends_on:
      - backend

  whatsapp-bridge:
    build: ./apps/whatsapp-bridge
    ports:
      - "3006:3006"
    environment:
      - BACKEND_URL=http://backend:8000/api/v1/whatsapp/webhook
      - PORT=3006
    volumes:
      - ./apps/whatsapp-bridge:/app
      - /app/node_modules
      - wwebjs_auth:/app/.wwebjs_auth
      - wwebjs_cache:/app/.wwebjs_cache
    depends_on:
      - backend
    restart: always

  notebook-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    volumes:
      - ./data/research:/research
      - ./data/ml-weights:/backend/ml_weights
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - BACKEND_API_URL=http://backend:8000/api/v1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis
    restart: always
    command: python scheduler/auto_scheduler.py --start

volumes:
  postgres_data:
  wwebjs_auth:
  wwebjs_cache: