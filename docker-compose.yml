

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agri_trust
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
      timeout: 5s

  redis:
    image: redis:7
    ports:
    
      - "6380:6379"

  backend:
    build: ./backend
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/agri_trust
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: test-key-replace-in-prod
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5000,http://localhost:5173
      ALLOWED_HOSTS: "*"
      MASTER_TEST_LOGIN_ENABLED: "true"
      MASTER_TEST_PHONE: "+263777777777"
      MASTER_TEST_PASSWORD: "master"
    volumes:
      - ./backend:/app
      - ./backend/ml_weights:/app/ml_weights
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  node-gateway:
    build: ./node-gateway
    ports:
      - "3005:3005"
    depends_on:
      - backend

  agent-dashboard:
    build: ./agent-dashboard
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    volumes:
      - ./agent-dashboard:/app
      - /app/node_modules
    depends_on:
      - backend

  ussd-simulator:
    build: ./ussd-simulator
    ports:
      - "5000:5000"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./ussd-simulator:/app
    depends_on:
      - backend

  notebook-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    volumes:
      - ./research:/research
      - ./backend/ml_weights:/backend/ml_weights
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - BACKEND_API_URL=http://backend:8000/api/v1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis
    restart: always
    command: python scheduler/auto_scheduler.py --start

volumes:
  postgres_data: