# ── HPA for frontends ─────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: public-website-hpa
  namespace: agritrust
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: public-website
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-portal-hpa
  namespace: agritrust
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-portal
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
