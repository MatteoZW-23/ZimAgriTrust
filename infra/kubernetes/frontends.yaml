# ── Public Website ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-website
  namespace: agritrust
spec:
  replicas: 2
  selector:
    matchLabels:
      app: public-website
  template:
    metadata:
      labels:
        app: public-website
    spec:
      containers:
      - name: public-website
        image: agritrust/public-website:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: public-website
  namespace: agritrust
spec:
  selector:
    app: public-website
  ports:
  - port: 80
    targetPort: 80
---
