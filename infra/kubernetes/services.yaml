# ── WhatsApp Service ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-service
  namespace: agritrust
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whatsapp-service
  template:
    metadata:
      labels:
        app: whatsapp-service
    spec:
      containers:
      - name: whatsapp-service
        image: agritrust/whatsapp-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        envFrom:
        - secretRef:
            name: agritrust-secrets
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 20
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-service
  namespace: agritrust
spec:
  selector:
    app: whatsapp-service
  ports:
  - port: 8001
    targetPort: 8001
---
# ── Celery Worker ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: agritrust
spec:
  replicas: 3
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: agritrust/backend:latest
        imagePullPolicy: Always
        command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=4", "-Q", "default,notifications,payments,ml"]
        envFrom:
        - configMapRef:
            name: agritrust-config
        - secretRef:
            name: agritrust-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
---
# ── Celery Beat (scheduler) ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: agritrust
spec:
  replicas: 1      # Only ONE beat scheduler
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
      - name: celery-beat
        image: agritrust/backend:latest
        imagePullPolicy: Always
        command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info", "--scheduler", "celery.schedulers:PersistentScheduler"]
        envFrom:
        - configMapRef:
            name: agritrust-config
        - secretRef:
            name: agritrust-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
# ── Celery Flower (monitoring UI) ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-flower
  namespace: agritrust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-flower
  template:
    metadata:
      labels:
        app: celery-flower
    spec:
      containers:
      - name: flower
        image: agritrust/backend:latest
        imagePullPolicy: Always
        command: ["celery", "-A", "app.celery_app", "flower", "--port=5555"]
        ports:
        - containerPort: 5555
        envFrom:
        - configMapRef:
            name: agritrust-config
        - secretRef:
            name: agritrust-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: celery-flower
  namespace: agritrust
spec:
  selector:
    app: celery-flower
  ports:
  - port: 5555
    targetPort: 5555
---
# ── HPA: Celery workers scale with queue depth ────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker-hpa
  namespace: agritrust
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
