server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: agritrust
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  # ── Kubernetes pod logs ──────────────────────────────────────────────────
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
    - role: pod
    pipeline_stages:
    - cri: {}
    - json:
        expressions:
          level: level
          msg: msg
          logger: logger
          request_id: request_id
    - labels:
        level:
        logger:
    - labeldrop:
        - filename
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_annotation_promtail_io_scrape]
      action: drop
      regex: "false"
    - source_labels: [__meta_kubernetes_namespace]
      target_label: namespace
    - source_labels: [__meta_kubernetes_pod_name]
      target_label: pod
    - source_labels: [__meta_kubernetes_pod_label_app]
      target_label: app
    - source_labels: [__meta_kubernetes_pod_container_name]
      target_label: container
    - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name]
      separator: /
      target_label: job

  # ── Static log files (if running on bare metal / docker-compose) ─────────
  - job_name: agritrust-backend
    static_configs:
    - targets: [localhost]
      labels:
        app: agritrust-backend
        env: production
        __path__: /var/log/agritrust/backend/*.log
    pipeline_stages:
    - json:
        expressions:
          level: levelname
          msg: message
          path: path
          status: status_code
          duration: duration
    - labels:
        level:
        path:
        status:

  - job_name: agritrust-nginx
    static_configs:
    - targets: [localhost]
      labels:
        app: nginx
        env: production
        __path__: /var/log/nginx/*.log
    pipeline_stages:
    - regex:
        expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) \S+" (?P<status>\d+) (?P<body_bytes_sent>\d+)'
    - labels:
        method:
        path:
        status:
