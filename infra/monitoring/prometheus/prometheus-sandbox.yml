global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'fintech-sandbox'
    environment: 'sandbox'

scrape_configs:
  # Backend API metrics
  - job_name: 'backend-sandbox'
    static_configs:
      - targets: ['backend-sandbox:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus-sandbox'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (if added)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files:
  - '/etc/prometheus/rules/*.yml'
